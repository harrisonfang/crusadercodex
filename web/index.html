<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A Codex pet gallery inspired by MapleStory's Crusader Codex.">
    <title>Crusader Codex</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="book-stage" aria-label="Crusader Codex">
      <picture class="book">
        <!-- Match this media condition to the fixed-size rule in styles.css. -->
        <source
          media="(min-width: 1030px) and (min-height: 772px)"
          srcset="./assets/resized/gms-v102/book@2x.png">
        <img
          src="./assets/originals/gms-v102/book.png"
          width="499"
          height="370"
          alt="An open Crusader Codex with two empty pages."
          fetchpriority="high">
      </picture>
    </main>
  </body>
</html>
