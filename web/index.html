<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A Codex pet gallery inspired by MapleStory's Crusader Codex.">
    <title>Crusader Codex</title>
    <link rel="stylesheet" href="./cursor.css">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./book.js"></script>
  </head>
  <body>
    <main class="book-stage" aria-label="Crusader Codex">
      <div class="codex-book">
        <img
          class="book"
          src="./assets/gms-v102/book.png"
          width="499"
          height="370"
          alt="An open Crusader Codex with two empty pages."
          fetchpriority="high">
        <button class="book-control home-button" id="book-home" type="button" aria-label="Home" aria-controls="book-pages" aria-current="location">
          <img class="control-normal" src="./assets/gms-v102/LeftTab/0/normal/0.png" width="57" height="35" alt="" draggable="false">
          <img class="control-hover" src="./assets/gms-v102/LeftTab/0/mouseOver/0.png" width="57" height="35" alt="" draggable="false">
          <img class="control-selected" src="./assets/gms-v102/LeftTab/0/selected/0.png" width="71" height="37" alt="" draggable="false">
        </button>
        <button class="book-control back-button" id="book-back" type="button" aria-label="Back" aria-controls="book-pages" disabled>
          <img class="control-normal" src="./assets/gms-v102/UpTab/normal/0.png" width="40" height="19" alt="" draggable="false">
          <img class="control-hover" src="./assets/gms-v102/UpTab/mouseOver/0.png" width="40" height="19" alt="" draggable="false">
          <img class="control-pressed" src="./assets/gms-v102/UpTab/pressed/0.png" width="40" height="19" alt="" draggable="false">
          <img class="control-disabled" src="./assets/gms-v102/UpTab/disabled/0.png" width="40" height="19" alt="" draggable="false">
        </button>
        <div class="chapter-tabs" role="tablist" aria-label="Book chapters" aria-orientation="vertical"></div>
        <section class="book-pages" id="book-pages" role="tabpanel" tabindex="0"></section>
      </div>
    </main>
    <script type="module" src="./cursor.js"></script>
  </body>
</html>
